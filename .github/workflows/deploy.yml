name: deploy

on:
  push:
    branches: [develop, staging, main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect application code
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "has_app=true" >> "$GITHUB_OUTPUT"; else echo "has_app=false" >> "$GITHUB_OUTPUT"; fi
      - id: env
        run: |
          case "${GITHUB_REF_NAME}" in
            develop) echo "environment=dev" >> "$GITHUB_OUTPUT" ;;
            staging) echo "environment=staging" >> "$GITHUB_OUTPUT" ;;
            main)    echo "environment=production" >> "$GITHUB_OUTPUT" ;;
          esac

  deploy:
    name: Migrate, deploy, smoke check
    needs: detect
    # Deploys stay off until the repository variable DEPLOY_ENABLED is set to "true"
    # (after the Cloudflare and GitHub setup in docs/environment-setup.md §2–§5).
    if: needs.detect.outputs.has_app == 'true' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.detect.outputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ENV: ${{ needs.detect.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @cloudflare/vite-plugin selects the Wrangler environment at build time.
      - name: Build for the target environment
        run: CLOUDFLARE_ENV="$TARGET_ENV" pnpm build

      - name: Apply D1 migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.jsonc --env "$TARGET_ENV"

      - name: Deploy Worker
        working-directory: apps/web
        # Deploys build/server/wrangler.json, generated for TARGET_ENV by the build step.
        run: pnpm exec wrangler deploy

      - name: Smoke check
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then echo "WORKER_URL variable is not set for this environment"; exit 1; fi
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$WORKER_URL/api/health" | tee /dev/stderr | grep -q '"ok":true'
